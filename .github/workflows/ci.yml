name: CI

# No paths filter here, deliberately. A workflow skipped by a paths filter leaves every
# check it would have published in a "Pending" state, and a branch that requires those
# checks can then never be merged. Documented at
# https://docs.github.com/en/actions/how-tos/manage-workflow-runs/skip-workflow-runs
# The path filtering therefore lives in the `changes` job below, which always runs and
# lets the expensive jobs skip themselves.
on:
  pull_request:
    types: [opened, synchronize, reopened]

  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      skip-security:
        description: "Skip Slither security scan"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─── Job 0: Does this change touch anything the Foundry jobs test? ──
  # Cheap, uncontainerised, and always runs, so the four required checks below always
  # exist. On a documentation-only change it reports sol=false and they skip.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sol: ${{ steps.filter.outputs.sol }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false

      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A manual dispatch has no diff to inspect, so it always runs everything.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "sol=true" >> "$GITHUB_OUTPUT"
            echo "manual dispatch: running the full suite" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE_SHA...$HEAD_SHA"
          elif [ -n "${BEFORE_SHA:-}" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            range="$BEFORE_SHA..$AFTER_SHA"
          else
            # First push to a branch, or a force-push whose parent is gone. Fail open.
            echo "sol=true" >> "$GITHUB_OUTPUT"
            echo "no resolvable diff range: running the full suite" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          changed=$(git diff --name-only "$range")
          if printf '%s\n' "$changed" | grep -qE '^(src|test|script)/.*\.sol$|^foundry\.toml$|^\.github/workflows/ci\.yml$'; then
            echo "sol=true" >> "$GITHUB_OUTPUT"
            echo "Solidity or toolchain files changed: running the full suite" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "sol=false" >> "$GITHUB_OUTPUT"
            echo "No Solidity, foundry.toml or ci.yml changes: Foundry jobs skipped" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ─── Job 1: Compile & Size Check ────────────────────────────────────
  # Every other Foundry job needs this one, so skipping it here skips the whole chain.
  build:
    needs: changes
    if: needs.changes.outputs.sol == 'true'
    runs-on: ubuntu-latest
    container:
      # Pinned by digest, not tag. Contains forge/cast/anvil v1.8.1, the same build developers
      # run locally, and nothing is downloaded at job time. Base is Ubuntu 22.04 with git, so
      # actions/checkout (incl. submodules) and every JS action work normally.
      # To bump: change the digest and the trailing comment together.
      image: ghcr.io/foundry-rs/foundry@sha256:0c00cb0bda1ab1b91c9a6bf60f4c76c09c1a8870824b6d4718afbabacf6f9a17 # v1.8.1
      # The image declares USER foundry (uid 1000); the runner work dir is not writable by it.
      options: --user root
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Verify pinned toolchain
        run: |
          forge --version
          echo "### Toolchain" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          forge --version >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Compile contracts
        run: forge build --sizes 2>&1 | tee contract-sizes.txt

      - name: Validate EIP-170 size limits
        run: |
          # Fail if any contract's runtime size exceeds 24576 bytes (24KB)
          # Column 2 = Contract name, Column 3 = Runtime Size (B) with commas
          awk -F '|' '/\|/ && NR>4 {
            name=$2; size=$3;
            gsub(/[[:space:],]/, "", name);
            gsub(/[[:space:],]/, "", size);
            if (size+0 > 24576) {
              printf "FAIL: %s exceeds 24KB limit (%s bytes)\n", name, size;
              fail=1
            }
          } END { if (fail) exit 1 }' contract-sizes.txt
          echo "All contracts within EIP-170 size limits"

      - name: Post size summary
        run: |
          echo "## Contract Sizes" >> "$GITHUB_STEP_SUMMARY"
          cat contract-sizes.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Cache build artifacts
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            out/
            cache/
          key: build-${{ github.sha }}

  # ─── Job 2: Test Suite ──────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    container:
      # Pinned by digest, not tag. Contains forge/cast/anvil v1.8.1, the same build developers
      # run locally, and nothing is downloaded at job time. Base is Ubuntu 22.04 with git, so
      # actions/checkout (incl. submodules) and every JS action work normally.
      # To bump: change the digest and the trailing comment together.
      image: ghcr.io/foundry-rs/foundry@sha256:0c00cb0bda1ab1b91c9a6bf60f4c76c09c1a8870824b6d4718afbabacf6f9a17 # v1.8.1
      # The image declares USER foundry (uid 1000); the runner work dir is not writable by it.
      options: --user root
    needs: build
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Restore build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            out/
            cache/
          key: build-${{ github.sha }}

      - name: Run tests
        run: forge test -vv --no-match-path "test/{stress,performance}/*"

  # ─── Job 3: Coverage Analysis ───────────────────────────────────────
  coverage:
    runs-on: ubuntu-latest
    container:
      # Pinned by digest, not tag. Contains forge/cast/anvil v1.8.1, the same build developers
      # run locally, and nothing is downloaded at job time. Base is Ubuntu 22.04 with git, so
      # actions/checkout (incl. submodules) and every JS action work normally.
      # To bump: change the digest and the trailing comment together.
      image: ghcr.io/foundry-rs/foundry@sha256:0c00cb0bda1ab1b91c9a6bf60f4c76c09c1a8870824b6d4718afbabacf6f9a17 # v1.8.1
      # The image declares USER foundry (uid 1000); the runner work dir is not writable by it.
      options: --user root
    needs: build
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Restore build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            out/
            cache/
          key: build-${{ github.sha }}

      - name: Generate LCOV report
        run: forge coverage --report lcov --no-match-path "test/{stress,performance}/*"

      - name: Filter coverage to source contracts
        run: |
          apt-get update -qq > /dev/null 2>&1
          apt-get install -y -qq lcov bc > /dev/null 2>&1
          lcov --remove lcov.info \
            'test/*' 'script/*' 'lib/*' \
            --output-file lcov-filtered.info \
            --rc branch_coverage=1 \
            --ignore-errors unused

      - name: Enforce 90% coverage threshold
        run: |
          COVERAGE=$(lcov --summary lcov-filtered.info 2>&1 | grep -oP 'lines\.*: \K[0-9.]+')
          echo "Line coverage: ${COVERAGE}%"
          echo "## Coverage: ${COVERAGE}%" >> "$GITHUB_STEP_SUMMARY"
          if [ "$(echo "$COVERAGE < 90" | bc -l)" -eq 1 ]; then
            echo "Coverage ${COVERAGE}% is below 90% threshold"
            exit 1
          fi

      - name: Post coverage to PR
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@87a815f34ec27a5826abba44ce09bbc688da58fd # v0.4.0
        with:
          lcov-file: lcov-filtered.info
          filter-changed-files: true
          delete-old-comments: true
          title: "Coverage Report"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: |
            lcov.info
            lcov-filtered.info
          retention-days: 30

  # ─── Job 4: Format & Lint ──────────────────────────────────────────
  quality:
    runs-on: ubuntu-latest
    container:
      # Pinned by digest, not tag. Contains forge/cast/anvil v1.8.1, the same build developers
      # run locally, and nothing is downloaded at job time. Base is Ubuntu 22.04 with git, so
      # actions/checkout (incl. submodules) and every JS action work normally.
      # To bump: change the digest and the trailing comment together.
      image: ghcr.io/foundry-rs/foundry@sha256:0c00cb0bda1ab1b91c9a6bf60f4c76c09c1a8870824b6d4718afbabacf6f9a17 # v1.8.1
      # The image declares USER foundry (uid 1000); the runner work dir is not writable by it.
      options: --user root
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Check formatting
        run: forge fmt --check

      - name: Run linter
        run: forge lint

  # ─── Job 5: Slither Security Scan ──────────────────────────────────
  security:
    name: Security Scan
    # Deliberately NOT containerised. crytic/slither-action is a Docker action, and a Docker
    # action cannot run inside a container job. Slither brings its own solc, so it does not
    # depend on the Foundry toolchain and is unaffected by the pin.
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !inputs.skip-security && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Run Slither
        uses: crytic/slither-action@b52cc1cbfee9ca3e8722dd5224299d16c9a6b80f # v0.4.2
        continue-on-error: true
        with:
          sarif: slither-results.sarif
          fail-on: none
          slither-args: --filter-paths "lib/|test/|script/" --exclude-dependencies

      - name: Upload Slither report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && hashFiles('slither-results.sarif') != ''
        with:
          name: slither-sarif
          path: slither-results.sarif
          retention-days: 30

  # ─── Job 6: Gas Comparison (PRs only) ──────────────────────────────
  gas-diff:
    name: Gas Diff
    runs-on: ubuntu-latest
    container:
      # Pinned by digest, not tag. Contains forge/cast/anvil v1.8.1, the same build developers
      # run locally, and nothing is downloaded at job time. Base is Ubuntu 22.04 with git, so
      # actions/checkout (incl. submodules) and every JS action work normally.
      # To bump: change the digest and the trailing comment together.
      image: ghcr.io/foundry-rs/foundry@sha256:0c00cb0bda1ab1b91c9a6bf60f4c76c09c1a8870824b6d4718afbabacf6f9a17 # v1.8.1
      # The image declares USER foundry (uid 1000); the runner work dir is not writable by it.
      options: --user root
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      actions: read
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Restore build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            out/
            cache/
          key: build-${{ github.sha }}

      - name: Generate gas report
        run: forge test --gas-report --no-match-path "test/{stress,performance}/*" > gasreport.ansi
        env:
          FOUNDRY_FUZZ_SEED: "0x${{ github.event.pull_request.base.sha }}"

      - name: Compare gas reports
        uses: Rubilmax/foundry-gas-diff@60e763d02526ee3299bd04278cb178d1547b134b # v3.21
        with:
          summaryQuantile: 0.9
          sortCriteria: avg,max
          sortOrders: desc,asc
        id: gas_diff

      - name: Post gas diff comment
        if: steps.gas_diff.outputs.markdown
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: gas-diff
          delete: ${{ !steps.gas_diff.outputs.markdown }}
          message: ${{ steps.gas_diff.outputs.markdown }}

  # ─── Job 7: Thorough Property Tests (main only) ────────────────────
  thorough:
    name: Thorough Property Tests
    runs-on: ubuntu-latest
    container:
      # Pinned by digest, not tag. Contains forge/cast/anvil v1.8.1, the same build developers
      # run locally, and nothing is downloaded at job time. Base is Ubuntu 22.04 with git, so
      # actions/checkout (incl. submodules) and every JS action work normally.
      # To bump: change the digest and the trailing comment together.
      image: ghcr.io/foundry-rs/foundry@sha256:0c00cb0bda1ab1b91c9a6bf60f4c76c09c1a8870824b6d4718afbabacf6f9a17 # v1.8.1
      # The image declares USER foundry (uid 1000); the runner work dir is not writable by it.
      options: --user root
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      FOUNDRY_PROFILE: ci_thorough
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Restore build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            out/
            cache/
          key: build-${{ github.sha }}

      - name: Run all tests (fuzz + invariant + stress + performance)
        run: forge test -vv
